<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMS救護車使用頻率檢索與紀錄系統 (智慧證件與相片參照試跑版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e293b', 900: '#0f172a', 950: '#090d16' },
                        ems: { blue: '#0284c7', red: '#dc2626', amber: '#d97706' }
                    },
                    fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input, select, textarea { font-size: 16px !important; }
        .tag-btn-selected { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
        button, label, select, input { touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <header class="bg-navy-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-ems-red text-white p-2 rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center w-9 h-9 shrink-0">
                    <i class="fa-solid fa-truck-medical text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xs sm:text-base md:text-lg font-black tracking-wide text-white truncate max-w-[200px] sm:max-w-none">EMS 救護車使用頻率系統</h1>
                    <p class="text-[10px] text-slate-400 hidden sm:block">智慧證件辨識與相片參照試跑版</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <div id="cloudStatusBadge" class="px-2 py-1 bg-slate-800 text-slate-300 text-[11px] font-semibold rounded-xl border border-slate-700 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400" id="cloudStatusDot"></span>
                    <span id="cloudStatusText" class="hidden md:inline">本機快取同步</span>
                </div>
                <button type="button" onclick="exportData('csv')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 transition flex items-center gap-1.5 shadow-xs cursor-pointer">
                    <i class="fa-solid fa-file-csv text-emerald-400 text-sm"></i>
                    <span class="hidden xs:inline">匯出報表</span>
                </button>
            </div>
        </div>
    </header>

    <main class
